<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 830" width="1180" height="830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Indonesian translation of z0r0z/cell@9ae536c92186ba7d0d8e0f1a12ccf68c7f27446e; source licensed CC0 1.0. -->
<rect width="1180" height="830" fill="#0C0C0B"/>
<text x="46" y="50" font-size="21" font-weight="200" letter-spacing="9" fill="#D8D2C8">CELL — PENGKABELAN FASE 1</text>
<rect x="47" y="61" width="26" height="2" fill="#B23A48"/>
<text x="46" y="82" font-size="10" letter-spacing="2" fill="#6F7178">Hanya reader. Dibuat dari tabel pin pada BUILD.md bagian 11. Penomoran BCM. Display, tombol, dan secure element dipasang pada Fase 2.</text>
<rect x="60" y="130" width="250" height="430" rx="6" fill="#121211" stroke="#8A8B8F" stroke-width="1.2"/>
<text x="76" y="158" font-size="13" fill="#D8D2C8">Raspberry Pi Zero 2 W</text>
<text x="76" y="176" font-size="9.5" fill="#6F7178">radio nonaktif, jalur antena dipotong</text>
<text x="76" y="220" font-size="10.5" fill="#9FA3A8">GPIO2/3</text>
<line x1="310" y1="216" x2="400" y2="216" stroke="#4E7A5B" stroke-width="1.4"/>
<circle cx="310" cy="216" r="2.6" fill="#4E7A5B"/>
<rect x="400" y="190" width="600" height="45" rx="4" fill="#141312" stroke="#4E7A5B" stroke-width="1"/>
<text x="414" y="208" font-size="12" fill="#D8D2C8">spektrometer AS7341</text>
<text x="414" y="224" font-size="9" fill="#6F7178">0x39 on I²C1, 100 kHz</text>
<text x="700" y="208" font-size="9" fill="#6F7178">8 kanal warna + Clear + NIR.</text>
<text x="700" y="220" font-size="9" fill="#6F7178">Mengendalikan LED putih #1 melalui pin LDR.</text>
<text x="76" y="278" font-size="10.5" fill="#9FA3A8">GPIO12</text>
<line x1="310" y1="274" x2="400" y2="274" stroke="#8A7440" stroke-width="1.4"/>
<circle cx="310" cy="274" r="2.6" fill="#8A7440"/>
<rect x="400" y="248" width="600" height="45" rx="4" fill="#141312" stroke="#8A7440" stroke-width="1"/>
<text x="414" y="266" font-size="12" fill="#D8D2C8">LED putih #2</text>
<text x="414" y="282" font-size="9" fill="#6F7178">2N7002 low-side, 68 Ω to +5 V</text>
<text x="700" y="266" font-size="9" fill="#6F7178">Berhadapan 45° dengan LED #1 sehingga</text>
<text x="700" y="280" font-size="9" fill="#6F7178">asimetri tetesan berkurang.</text>
<text x="76" y="338" font-size="10.5" fill="#9FA3A8">GPIO6</text>
<line x1="310" y1="334" x2="400" y2="334" stroke="#B23A48" stroke-width="1.4"/>
<circle cx="310" cy="334" r="2.6" fill="#B23A48"/>
<rect x="400" y="308" width="600" height="45" rx="4" fill="#141312" stroke="#B23A48" stroke-width="1"/>
<text x="414" y="326" font-size="12" fill="#D8D2C8">laser 650 nm, ≤5 mW</text>
<text x="414" y="342" font-size="9" fill="#6F7178">2N7002, interlocked</text>
<text x="700" y="326" font-size="9" fill="#6F7178">SUMBER KOHEREN WAJIB DIGUNAKAN.</text>
<text x="700" y="338" font-size="9" fill="#6F7178">LED tidak menghasilkan speckle.</text>
<text x="76" y="396" font-size="10.5" fill="#9FA3A8">GPIO23</text>
<line x1="310" y1="392" x2="400" y2="392" stroke="#8A7440" stroke-width="1.4"/>
<circle cx="310" cy="392" r="2.6" fill="#8A7440"/>
<rect x="400" y="366" width="600" height="45" rx="4" fill="#141312" stroke="#8A7440" stroke-width="1"/>
<text x="414" y="384" font-size="12" fill="#D8D2C8">LED IR 940 nm</text>
<text x="414" y="400" font-size="9" fill="#6F7178">2N7002 low-side, 47 Ω to +3V3</text>
<text x="700" y="384" font-size="9" fill="#6F7178">Satu posisi dengan LED #1. Menyediakan</text>
<text x="700" y="398" font-size="9" fill="#6F7178">kanal inframerah untuk mode sentuh.</text>
<text x="76" y="456" font-size="10.5" fill="#9FA3A8">GPIO22</text>
<line x1="310" y1="452" x2="400" y2="452" stroke="#9FA3A8" stroke-width="1.4"/>
<circle cx="310" cy="452" r="2.6" fill="#9FA3A8"/>
<rect x="400" y="426" width="600" height="45" rx="4" fill="#141312" stroke="#9FA3A8" stroke-width="1"/>
<text x="414" y="444" font-size="12" fill="#D8D2C8">Microswitch cartridge</text>
<text x="414" y="460" font-size="9" fill="#6F7178">pull-up, LOW saat terpasang</text>
<text x="700" y="444" font-size="9" fill="#6F7178">Mengaktifkan gerbang laser. Pasang interlock</text>
<text x="700" y="456" font-size="9" fill="#6F7178">meskipun ruang optik tertutup.</text>
<text x="76" y="514" font-size="10.5" fill="#9FA3A8">CSI</text>
<line x1="310" y1="510" x2="400" y2="510" stroke="#B23A48" stroke-width="1.4"/>
<circle cx="310" cy="510" r="2.6" fill="#B23A48"/>
<rect x="400" y="484" width="600" height="45" rx="4" fill="#141312" stroke="#B23A48" stroke-width="1"/>
<text x="414" y="502" font-size="12" fill="#D8D2C8">KAMERA PI, LENSA DILEPAS</text>
<text x="414" y="518" font-size="9" fill="#6F7178">mini-CSI ribbon</text>
<text x="700" y="502" font-size="9" fill="#6F7178">Exposure tetap ≤2 ms, gain tetap,</text>
<text x="700" y="516" font-size="9" fill="#6F7178">AWB dan denoise nonaktif.</text>
<line x1="46" y1="586" x2="1134" y2="586" stroke="#22242A" stroke-width="1"/>
<text x="46" y="606" font-size="10" letter-spacing="3" fill="#6F7178">PENYEBAB UMUM KEGAGALAN PERTAMA</text>
<text x="46" y="630" font-size="11" fill="#D8D2C8">Kedua breakout I²C sudah dilengkapi pull-up.</text>
<text x="46" y="646" font-size="9.5" fill="#6F7178">Lepas salah satu pasang 2.2 kΩ. Jika keduanya terpasang, bus mungkin tidak terdeteksi dan sensor tampak mati, bukan seperti kesalahan pengkabelan. Ini</text>
<text x="46" y="660" font-size="9.5" fill="#6F7178">adalah kegagalan paling umum pada perakitan pertama.</text>
<text x="46" y="690" font-size="11" fill="#D8D2C8">Ruang optik harus kedap cahaya sebelum hasil pembacaan dapat digunakan.</text>
<text x="46" y="706" font-size="9.5" fill="#6F7178">Gunakan PETG hitam, ≥4 perimeter, dan cat hitam doff di bagian dalam. Uji dengan cartridge terpasang, ruangan 10.000 lux, semua LED mati; kanal Clear harus di bawah 0,5% nilai</text>
<text x="46" y="720" font-size="9.5" fill="#6F7178">saat LED menyala. PETG tipis meneruskan cukup banyak cahaya; kebocoran akan merusak gerbang 415 nm tanpa kegagalan yang terlihat jelas.</text>
<text x="46" y="750" font-size="11" fill="#D8D2C8">Lensa kamera harus dilepas dan exposure harus tetap.</text>
<text x="46" y="766" font-size="9.5" fill="#6F7178">Butir speckle tanpa lensa berukuran sekitar 4 px pada IMX219 di jarak 20 mm sehingga tersampel dengan baik; jika lensa terpasang ukurannya ~1,6 px dan kurang tersampel. Setiap</text>
<text x="46" y="780" font-size="9.5" fill="#6F7178">perubahan exposure otomatis atau white balance otomatis antarfoto akan merusak pengukuran korelasi.</text>
</svg>